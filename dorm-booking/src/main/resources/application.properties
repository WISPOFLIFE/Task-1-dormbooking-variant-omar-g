# Application Properties for Dorm Booking Application

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/dorm_booking
spring.datasource.username=root
spring.datasource.password=your_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.example.dormbooking=DEBUG

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin_password

# Other Configuration
app.defaultRoomCapacity=4
app.bookingExpirationDays=7